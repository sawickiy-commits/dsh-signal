<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>

  <!-- Radar / Signal Arcs -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="64" cy="64" r="30" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.85"/>
  
  <!-- Outer Pulse Glow -->
  <circle cx="64" cy="64" r="22" fill="url(#glowGrad)"/>

  <!-- Center Core Signal Dot -->
  <circle cx="64" cy="64" r="14" fill="#10b981" filter="url(#shadow)"/>
  <circle cx="60" cy="60" r="4" fill="#ffffff" opacity="0.8"/>

  <!-- Dynamic Signal Wave / Spark Icon -->
  <path d="M44 64h8l4-10 8 20 6-14 4 4h10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
